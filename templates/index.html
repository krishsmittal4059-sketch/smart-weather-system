<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Smart Weather System</title>
<style>
body{font-family:Arial,sans-serif;margin:0;background:#eef3f7;color:#17202a}
header{padding:24px;text-align:center;background:#1f2937;color:#fff}
main{max-width:900px;margin:24px auto;padding:0 16px}
.mode{display:flex;gap:10px;justify-content:center;margin:18px 0}
button{padding:12px 22px;border:0;border-radius:10px;font-size:16px;cursor:pointer}
.active{outline:3px solid #111827}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:15px}
.card{background:#fff;border-radius:14px;padding:22px;text-align:center;box-shadow:0 2px 10px #0001}
.label{color:#64748b}.value{font-size:32px;font-weight:bold;margin-top:8px}
#status{text-align:center;font-weight:bold;margin:12px}.test{color:#9a6700}.live{color:#15803d}.error{color:#b91c1c}
small{display:block;text-align:center;color:#64748b;margin:20px}
</style>
</head>
<body>
<header><h1>🌦 Smart Weather System</h1><div>Raspberry Pi 1 B+ • BME280</div></header>
<main>
<div class="mode">
<button id="testBtn" onclick="setMode('test')">🧪 Test Mode</button>
<button id="liveBtn" onclick="setMode('live')">🌦 Live Mode</button>
</div>
<div id="status">Starting...</div>
<div class="grid">
<div class="card"><div class="label">Temperature</div><div class="value"><span id="temperature">--</span> °C</div></div>
<div class="card"><div class="label">Humidity</div><div class="value"><span id="humidity">--</span> %</div></div>
<div class="card"><div class="label">Pressure</div><div class="value"><span id="pressure">--</span> hPa</div></div>
<div class="card"><div class="label">Altitude</div><div class="value"><span id="altitude">--</span> m</div></div>
</div>
<small>Updated: <span id="timestamp">--</span></small>
</main>
<script>
async function setMode(mode){
  await fetch('/api/mode/'+mode,{method:'POST'});
  update();
}
function put(id,v){document.getElementById(id).textContent=v??'--'}
async function update(){
 try{
  const r=await fetch('/api/weather',{cache:'no-store'}); const d=await r.json();
  put('temperature',d.temperature);put('humidity',d.humidity);put('pressure',d.pressure);put('altitude',d.altitude);put('timestamp',d.timestamp);
  const s=document.getElementById('status');
  s.textContent=d.mode==='test'?'🧪 TEST MODE — simulated data':(d.ok?'🌦 LIVE MODE — BME280 online':'⚠ LIVE MODE — BME280 error: '+d.error);
  s.className=d.mode==='test'?'test':(d.ok?'live':'error');
  document.getElementById('testBtn').classList.toggle('active',d.mode==='test');
  document.getElementById('liveBtn').classList.toggle('active',d.mode==='live');
 }catch(e){document.getElementById('status').textContent='Connection error: '+e}
}
update();setInterval(update,3000);
</script>
</body>
</html>
